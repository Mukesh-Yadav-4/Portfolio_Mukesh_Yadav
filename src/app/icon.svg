<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10B981" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Subtle Center Glow -->
  <circle cx="32" cy="32" r="18" fill="#10B981" opacity="0.15" />

  <!-- ECG Waveform Trace -->
  <path d="M 8 32 L 20 32 L 24 35 L 31 14 L 37 48 L 42 30 L 47 26 L 51 32 L 56 32"
        fill="none"
        stroke="url(#ecgGrad)"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)" />
</svg>
